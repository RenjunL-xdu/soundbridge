name: Test and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The DSP is verified against a simulated acoustic channel, so the whole
      # signal path is exercised in CI with no audio hardware involved.
      # Pure arithmetic, no simulation: catches burst/capture-window mismatches
      # that every signal-level test happily passes through.
      - name: Burst timing vs capture windows
        run: node test/timing.test.mjs
      - name: Reed-Solomon
        run: node test/rs.test.mjs
      - name: Fountain code
        run: node test/fountain.test.mjs
      - name: Modem through a simulated room
        run: node test/burst.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
